input: host_os_change.pcap

localnet: 172.16.1.0/24

requires: pro

# Add a view interface (pcap interface ifid 0, view interface ifid 1)
options:
  - -i=view:all

# Same as host_os_change_01.yaml, with the host on a view interface.
#
# The flows of a viewed interface have no hosts, and the host of the view is
# created later on, by the view: the OS learnt from the TCP fingerprint of a
# flow used to be lost when the host of the view was not there yet. In this
# pcap the OS of the host was then learnt only from the User-Agent of its
# second connection (Windows), that is ignored on the other interfaces as it
# does not match the OS learnt from the TCP fingerprint (Linux).
#
# The host of the view also reports its TCP fingerprint, and each flow of the
# view its own one.
# The view applies the fingerprints of its flows in the order it visits them
# (the order of the flows hash, not the time order): the host has the one of
# its latest flow by time (Linux), as on the pcap interface
# (host_os_change_01.yaml).

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # OS of the host of the view (1 = Windows, 4 = Linux, see ndpi_os) and how it has been learnt
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=1&host=172.16.1.137" | jq -c '{rc_str, host: .rsp.ip, os: .rsp.os, os_learning: .rsp.os_learning, tcp_fingerprint: .rsp.tcp_fingerprint, inconsistent_host_os: .rsp.inconsistent_host_os}'

  # TCP fingerprint of each flow (Windows: 2_128_64240_47466ece, Linux: 2_64_64240_789c1d1f)
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active_list.lua?ifid=1&start=0&length=100" | \
    jq -c '.rsp[] | {cli: "\(.client.ip):\(.client.port)", srv: "\(.server.ip):\(.server.port)", key: .key, hash_id: .hash_id}' | \
    while read -r flow; do
      key=$(echo "${flow}" | jq -r .key)
      hash_id=$(echo "${flow}" | jq -r .hash_id)
      curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/live/flow_details.lua?ifid=1&flow_key=${key}&flow_hash_id=${hash_id}" | \
        jq -c --argjson flow "${flow}" '{cli: $flow.cli, srv: $flow.srv, tcp_fingerprint: .rsp.fingerprints.tcp}'
    done | jq -s -c 'sort_by(.cli) | .[]'
