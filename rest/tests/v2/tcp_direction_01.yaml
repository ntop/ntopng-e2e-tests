pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # Client and server of the active flows, by flow number (i): the client
  # must be 192.168.9.i
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active.lua?ifid=0&perPage=500" | jq -c '[.rsp.data[] | {i: ((if (.client.ip | startswith("192.168.9.")) then .client.ip else .server.ip end) | split(".")[3] | tonumber), cli: "\(.client.ip):\(.client.port)", srv: "\(.server.ip):\(.server.port)", client_ok: (.client.ip | startswith("192.168.9."))}] | sort_by(.i, .cli) | .[]'

  # Server ports learned by the client and by the server of each flow
  for i in $(seq 1 107); do
    c=$(curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/open_ports.lua?ifid=0&host=192.168.9.${i}" | jq -c '[.rsp[]?.key | tonumber] | sort')
    s=$(curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/open_ports.lua?ifid=0&host=192.168.10.${i}" | jq -c '[.rsp[]?.key | tonumber] | sort')
    echo "{\"i\": ${i}, \"client_server_ports\": ${c:-null}, \"server_server_ports\": ${s:-null}}"
  done
