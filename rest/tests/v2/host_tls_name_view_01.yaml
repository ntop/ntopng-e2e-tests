input: tls_cert_expired.pcap

localnet: 192.168.2.0/24

options:
  - -i=view:all

requires: pro

# Same as host_tls_name_01, with a view interface (pcap interface ifid 0,
# view interface ifid 1): the TLS name of the server on the view.

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  for h in 192.168.2.126 104.111.215.93; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=1&host=${h}" | jq -c --arg host "${h}" 'if .rc == 0 then {host: $host, localhost: .rsp.localhost, names: ((.rsp.names | objects) // {})} else {host: $host, rc: .rc} end'
  done
