input: dhcp_v4_cases.pcap

localnet: 192.168.4.0/24

options:
  - -i=view:all

requires: pro

# Same as flow_direction_dhcp_02, with a view interface (pcap interface ifid
# 0, view interface ifid 1): the client and the server of the active flows of
# the view, and the number of active flows of the hosts of the view as client
# and as server (the flows swapped by the viewed interface must be accounted
# with the swapped roles).
#
# Expected: same flows as flow_direction_dhcp_02; the DHCP servers
# 192.168.4.1 and 192.168.4.2 are clients only of the replies sent to
# broadcast (one flow each), the relay agent 192.168.4.254 is server of the
# flow to .32, the other hosts are clients only (the relay agents .250-.253
# are clients of the DHCP servers).
#
# DHCP name: the host of the view keeps the name of the latest DHCP request of
# 192.168.4.60 ("new-name"), as in flow_direction_dhcp_02.

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # Client and server of the active flows of the view
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active.lua?ifid=1&perPage=100" | jq -c '[.rsp.data[] | {cli_ip: .client.ip, cli_port: .client.port, srv_ip: .server.ip, srv_port: .server.port, vlan: .vlan, l7: .protocol.l7}] | sort_by(.cli_ip, .srv_ip, .vlan) | .[]'

  # Active flows of the hosts of the view, as client and as server, and their
  # DHCP name
  for h in 192.168.4.1 192.168.4.1@10 192.168.4.1@20 192.168.4.2 192.168.4.60 \
           192.168.4.11 192.168.4.12 192.168.4.13 192.168.4.14 192.168.4.15 192.168.4.16 192.168.4.17 \
           192.168.4.20 192.168.4.21 192.168.4.22 192.168.4.23 192.168.4.24 192.168.4.32 192.168.4.40@10 192.168.4.41@20 \
           192.168.4.250 192.168.4.251 192.168.4.252 192.168.4.253 192.168.4.254; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=1&host=${h}" | jq -c --arg host "${h}" 'if .rc == 0 then {host: $host, as_client: (.rsp["active_flows.as_client"] // 0), as_server: (.rsp["active_flows.as_server"] // 0)} + ((.rsp.names | objects | .dhcp) // null | if . then {dhcp_name: .} else {} end) else {host: $host, rc: .rc} end'
  done

  # Server ports (local_server_ports) and ports contacted as client
  # (remote_contacted_ports) learned by each local host, per interface.
  # NOTE: baseline of the learning of the server ports, recorded before
  # changing it: not necessarily the expected values.
  # Not stable, left out: the ports contacted by the hosts of the view
  # (ifid 1). A view host can be created twice at the same time (by the
  # alerts of the viewed interface and by the view) and the REST shows the
  # empty copy; a flow visited by the view before its pending swap gives
  # the ports of the reversed flow, never removed.
  for ifid in 0 1; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/active.lua?ifid=${ifid}&mode=local&perPage=1000" | \
      jq -r '.rsp.data[] | if ((.vlan // 0) | tonumber? // 0) > 0 then "\(.ip)@\(.vlan)" else .ip end' | sort -V | \
      while read -r h; do
        curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/used_ports.lua?ifid=${ifid}&host=${h}" | \
          jq -c --arg h "${h}" --argjson ifid ${ifid} '{used_ports: {ifid: $ifid, host: $h, server: ([.rsp.local_server_ports | to_entries[]? | "\(.key) \(.value)"] | sort), contacted: ([.rsp.remote_contacted_ports | to_entries[]? | "\(.key) \(.value)"] | sort)}} | if $ifid == 1 then del(.used_ports.contacted) else . end'
      done
  done
