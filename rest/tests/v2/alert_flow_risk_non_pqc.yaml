input: non_pqc.pcap

localnet: 192.168.16.213,192.168.1.10,192.168.1.126

ignore:
  - date
  - tstamp
  - historical_url
  - query_duration_msec
  - epoch_begin
  - epoch_end
  - duration
  - title
  - num_records_processed
  - label

pre: |
  # Only interested in PQC
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "ndpi_non_pqc"}' http://localhost:3333/lua/rest/v2/enable/check.lua 
  sleep 10s

post: |
  curl -s -u admin:admin  -H "Content-Type: application/json" -d '{"ifid": 0, "status": "any"}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua
