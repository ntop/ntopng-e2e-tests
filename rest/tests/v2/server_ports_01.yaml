input: server_ports_cases.pcap

localnet: 192.168.0.0/16

requires: pro

# Server ports learned by the local servers (local_server_ports) and ports
# contacted by the local clients (remote_contacted_ports), for the cases not
# covered by the direction tests (tcp_direction_01, flow_direction_*):
# server_ports_cases.pcap, generated with scapy, one flow per case (two for 8-10),
# client 192.168.11.i, server 192.168.12.i.
#
# A port is learned only from the flows whose direction is reliable (decided)
# and whose server has answered: with a SYN-ACK (TCP), with any traffic (UDP).
#
#   1  TCP 40001 -> 5555   handshake, data, closed by a RST from the server: learned
#   2  TCP 40002 -> 5555   SYN, SYN-ACK lost, data both ways: not learned (no SYN-ACK)
#   3  UDP 40003 -> 40100  unknown protocol, request and reply: not learned (direction not decided)
#   4  UDP 40004 -> 514    syslog, one way: not learned (no reply), not even as contacted
#   5  UDP 123 <-> 123     NTP request and reply: learned (equal ports, decided by the payload)
#   6  UDP 53 <-> 53       DNS query and response: learned (equal ports, decided by the payload)
#
# A port learned from a flow whose protocol is only guessed (by port or by IP)
# gets Unknown as protocol, and Unknown never replaces a known protocol:
#
#   7  TCP 40007 -> 8080   handshake only (HTTP_Proxy guessed by the port): learned as Unknown
#   8  TCP 4000x -> 8080   HTTP detected by DPI, then a handshake only: the port keeps HTTP
#
# The flows opened by another one teach no port, neither server nor contacted:
#
#   9  UDP 16384 <-> 16386 RTP and 16385 <-> 16387 RTCP media (both sides send): not learned
#  10  TCP 40010 -> 21     FTP control (passive mode): learned; its data connection
#      TCP 40110 -> 50000  (directory listing, FTP_DATA): not learned

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # Client and server of the active flows
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active.lua?ifid=0&perPage=500" | jq -c '[.rsp.data[] | {cli: "\(.client.ip):\(.client.port)", srv: "\(.server.ip):\(.server.port)", proto: .protocol.l4, l7: .protocol.l7}] | sort_by(.cli, .srv) | .[]'

  # Server ports (local_server_ports) and ports contacted as client
  # (remote_contacted_ports) learned by each local host, per interface.
  # A port is learned only from the flows whose direction is reliable (decided,
  # see doc/developers/README.flow_direction.md in ntopng) and whose server has
  # answered: with a SYN-ACK (TCP), with any traffic (UDP).
  for ifid in 0; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/active.lua?ifid=${ifid}&mode=local&perPage=1000" | \
      jq -r '.rsp.data[] | if ((.vlan // 0) | tonumber? // 0) > 0 then "\(.ip)@\(.vlan)" else .ip end' | sort -V | \
      while read -r h; do
        curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/used_ports.lua?ifid=${ifid}&host=${h}" | \
          jq -c --arg h "${h}" --argjson ifid ${ifid} '{used_ports: {ifid: $ifid, host: $h, server: ([.rsp.local_server_ports | to_entries[]? | "\(.key) \(.value)"] | sort), contacted: ([.rsp.remote_contacted_ports | to_entries[]? | "\(.key) \(.value)"] | sort)}}'
      done
  done
