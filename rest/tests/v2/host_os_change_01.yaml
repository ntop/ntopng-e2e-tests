input: host_os_change.pcap

localnet: 172.16.1.0/24

# The Operating System of a host must follow what is observed in its traffic.
#
# In the pcap the host 172.16.1.137 opens two TCP connections: the first one
# with the TCP fingerprint of Windows, the second one (10 seconds later) with
# the TCP fingerprint of Linux.
#
# The change of the OS used to be applied to the host only: the information
# kept about how the OS has been learnt (and, with it, the OS of the asset)
# was not updated, and was still reporting the first OS.
#
# The host also reports its TCP fingerprint, and each flow its own one: the
# host has the one of its latest flow (Linux), as its OS (it used to keep the
# first one, Windows, while its OS was Linux). Two fingerprints of different
# OSes: the OS of the host is inconsistent (gateway, NAT, VPN, ...).

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # OS of the host (1 = Windows, 4 = Linux, see ndpi_os) and how it has been learnt
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=0&host=172.16.1.137" | jq -c '{rc_str, host: .rsp.ip, os: .rsp.os, os_learning: .rsp.os_learning, tcp_fingerprint: .rsp.tcp_fingerprint, inconsistent_host_os: .rsp.inconsistent_host_os}'

  # TCP fingerprint of each flow (Windows: 2_128_64240_47466ece, Linux: 2_64_64240_789c1d1f)
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active_list.lua?ifid=0&start=0&length=100" | \
    jq -c '.rsp[] | {cli: "\(.client.ip):\(.client.port)", srv: "\(.server.ip):\(.server.port)", key: .key, hash_id: .hash_id}' | \
    while read -r flow; do
      key=$(echo "${flow}" | jq -r .key)
      hash_id=$(echo "${flow}" | jq -r .hash_id)
      curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/live/flow_details.lua?ifid=0&flow_key=${key}&flow_hash_id=${hash_id}" | \
        jq -c --argjson flow "${flow}" '{cli: $flow.cli, srv: $flow.srv, tcp_fingerprint: .rsp.fingerprints.tcp}'
    done | jq -s -c 'sort_by(.cli) | .[]'
