input: dhcp_v6_cases.pcap

localnet: fd00:6::/64

requires: pro

# The DHCP service and the "DHCP Server" built-in tag (tag 2) of the hosts of
# dhcp_v6_cases.pcap (see flow_direction_dhcpv6_01 for the flows).
#
# The DHCP service is detected on the host acting as DHCPv6 server; the tag is
# set by the service or by the configured DHCP servers (Network
# Configuration): fe80::15, a DHCPv6 client, is configured as DHCP server to
# cover the second case (tag, no service).
#
# Expected:
# - service and tag on the DHCPv6 servers fd00:6::1 (also on VLAN 10 and 20)
#   and fd00:6::2 (the rogue server is a DHCPv6 server too), and on the relay
#   agent fd00:6::fc that delivers a reply to a client;
# - no service and no tag on the clients, on the relay agents talking to the
#   servers (fd00:6::fa, fb, fd, fe) and on ff02::1:2 (the server of the
#   requests sent to multicast);
# - tag without service on fe80::15 (configured).

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"dhcp_list": "fe80::15"}' http://localhost:3333/lua/rest/v2/set/network/config.lua -o /dev/null

runtime: |
  # DHCP service and DHCP Server tag (bit 2 of the tags bitmap) of the hosts
  for h in fd00:6::1 fd00:6::1@10 fd00:6::1@20 fd00:6::2 \
           fe80::11 fe80::12 fe80::13 fe80::14 fe80::15 fe80::16 fe80::17 \
           fe80::20 fe80::21 fe80::22 fe80::23 fe80::24 fe80::32 fe80::40@10 fe80::41@20 \
           fd00:6::fa fd00:6::fb fd00:6::fc fd00:6::fd fd00:6::fe \
           fd00:6::f0 fd00:6::f1 fd00:6::f2 fe80::50 fe80::51 fe80::52 ff02::1:2; do
    tags=$(curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/config.lua?ifid=0&host=${h}" | jq '.rsp.tags // 0')
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=0&host=${h}" | jq -c --arg host "${h}" --argjson tags "${tags:-0}" 'if .rc == 0 then {host: $host, dhcp_server: (.rsp.services.dhcp == true), dhcp_server_tag: ((($tags / 4) | floor) % 2 == 1)} else {host: $host, rc: .rc} end'
  done
