input: dhcp_v6_cases.pcap

localnet: fd00:6::/64

options:
  - -i=view:all

requires: pro

# Same as alert_unexpected_dhcpv6_server_03, with a view interface
# (pcap interface ifid 0, view interface ifid 1): the alerts are read on
# the view (the viewed interface has no alert store of its own).
#
# Unexpected DHCP server alert on DHCPv6 flows with no DHCP server configured:
# the check is disabled in that case, so no alert at all (also for the rogue
# server).

ignore:
  - duration
  - title
  - epoch_end
  - num_records_processed
  - query_duration_msec

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"dhcp_list": ""}' http://localhost:3333/lua/rest/v2/set/network/config.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "unexpected_dhcp"}' http://localhost:3333/lua/rest/v2/enable/check.lua -o /dev/null

post: |
  # The alerts (none expected)
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 1, "status": "any", "length": 100}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua | jq -c '{num_alerts: (.rsp.records | length)}'
