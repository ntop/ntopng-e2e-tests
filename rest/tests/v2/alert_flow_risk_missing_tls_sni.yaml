input: tls_cipher_suites.pcap

localnet: 10.206.0.0/16

ignore:
  - date
  - tstamp
  - historical_url
  - query_duration_msec
  - epoch_begin
  - epoch_end
  - duration
  - title
  - num_records_processed
  - label

pre: |
  # Only interested in missing SNI
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "ndpi_tls_missing_sni"}' http://localhost:3333/lua/rest/v2/enable/check.lua
  sleep 20s

runtime: |
  sleep 10s
  curl -s -u admin:admin  -H "Content-Type: application/json" -d '{"ifid": 0, "status": "any"}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua
