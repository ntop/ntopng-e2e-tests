input: test_01.pcap

localnet: 192.168.1.0/24

ignore: # duration and last seen depend on the current system time, whereas first seen must not change
  - duration
  - seen.last
  - throughput_bps
  - throughput_pps
  - throughput_trend_bps
  - throughput_trend_pps
  - bytes
  - packets
  - num_flows
  # HTTP request/response rates: computed by the periodic updates on the time
  # of the packets read, they depend on the timing of the pcap replay
  - '"[1-5]xx":'
  - '"get":'
  - '"head":'
  - '"other":'
  - '"post":'
  - '"put":'

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"config": [{"key": "dns_list", "value": "10.10.10.10"}]}' http://localhost:3333/lua/rest/v2/set/network/config.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "enable"}' http://localhost:3333/lua/toggle_all_checks.lua

runtime: |
  curl -s -u admin:admin  -H "Content-Type: application/json" -d '{"ifid": 0, "host" : "192.168.1.93"}' http://localhost:3333/lua/rest/v2/get/host/data.lua
