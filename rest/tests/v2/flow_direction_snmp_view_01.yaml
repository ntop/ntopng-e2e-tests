input: snmp_cases.pcap

localnet: 192.168.8.0/24

options:
  - -i=view:all

requires: pro

# Same as flow_direction_snmp_01, with a view interface (pcap interface ifid
# 0, view interface ifid 1): the client and the server of the active flows of
# the view, and the number of active flows of the hosts of the view as client
# and as server (the flows swapped by the viewed interface must be accounted
# with the swapped roles).

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # Client and server of the active flows of the view
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active.lua?ifid=1&perPage=100" | jq -c '[.rsp.data[] | {cli_ip: .client.ip, cli_port: .client.port, srv_ip: .server.ip, srv_port: .server.port, l7: .protocol.l7}] | sort_by(.cli_ip, .srv_ip, .cli_port) | .[]'

  # Active flows of the hosts of the view, as client and as server
  for h in 192.168.8.1 192.168.8.10 192.168.8.11 192.168.8.12 192.168.8.13 192.168.8.14 192.168.8.15 192.168.8.16 192.168.8.17 192.168.8.18 192.168.8.19 192.168.8.20 192.168.8.21; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=1&host=${h}" | jq -c --arg host "${h}" 'if .rc == 0 then {host: $host, as_client: (.rsp["active_flows.as_client"] // 0), as_server: (.rsp["active_flows.as_server"] // 0)} else {host: $host, rc: .rc} end'
  done
