input: dhcp_v6_cases.pcap

localnet: fd00:6::/64

options:
  - -i=view:all

requires: pro

# Same as alert_unexpected_dhcpv6_server_02, with a view interface
# (pcap interface ifid 0, view interface ifid 1): the alerts are read on
# the view (the viewed interface has no alert store of its own).
#
# Unexpected DHCP server alert with fd00:6::1 configured as DHCP server on VLAN
# 10 only (fd00:6::1@10): its flows on VLAN 20 (REPLY to fe80::41) and without
# VLAN must raise the alert too, the flow on VLAN 10 (REPLY to fe80::40) must
# not. Same cases as alert_unexpected_dhcpv6_server_01 otherwise (e.g. no alert
# for the RELEASE of fe80::15 to fd00:6::1, which is not replied).

ignore:
  - duration
  - title
  - epoch_end
  - num_records_processed
  - query_duration_msec

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"dhcp_list": "fd00:6::1@10"}' http://localhost:3333/lua/rest/v2/set/network/config.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "unexpected_dhcp"}' http://localhost:3333/lua/rest/v2/enable/check.lua -o /dev/null

post: |
  # The number of alerts, then the alerts: flow, description, roles and score
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 1, "status": "any", "length": 100}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua | jq -c '{num_alerts: (.rsp.records | length)}, ([.rsp.records[] | {cli_ip: .cli_ip.value, cli_port: .cli_port.value, srv_ip: .srv_ip.value, srv_port: .srv_port.value, vlan: .vlan_id.value, alert: .alert_name, description: .description.descr, cli_role: .cli_role.value, srv_role: .srv_role.value, score: .score.value}] | sort_by(.cli_ip, .srv_ip, .vlan) | .[])'
