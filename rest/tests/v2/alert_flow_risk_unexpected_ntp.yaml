input: ntp_contacts.pcap

localnet: 192.168.2.0/24

ignore:
  - duration
  - title
  - epoch_end
  - num_records_processed
  - query_duration_msec
  - country

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ntp_list": "10.10.10.10"}' http://localhost:3333/lua/rest/v2/set/network/config.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "unexpected_ntp"}' http://localhost:3333/lua/rest/v2/enable/check.lua
  sleep 10s

post: |
  curl -s -u admin:admin  -H "Content-Type: application/json" -d '{"ifid": 0, "status": "any"}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua
