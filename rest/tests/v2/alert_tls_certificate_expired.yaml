input: tls_cert_expired.pcap

localnet: 192.168.2.0/24

ignore:
  - date
  - tstamp
  - title
  - historical_url
  - query_duration_msec
  - epoch_begin
  - epoch_end
  - duration
  - num_records_processed
  - label

pre: |
  curl -sS -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -sS -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "tls_certificate_expired"}' http://localhost:3333/lua/rest/v2/enable/check.lua

post: |
  curl -s -u admin:admin  -H "Content-Type: application/json" -d '{"ifid": 0, "status": "any"}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua
