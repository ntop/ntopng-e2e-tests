input: snmp_cases.pcap

localnet: 192.168.8.0/24

requires: pro

# Client and server of SNMP flows (snmp_cases.pcap, generated with scapy: one
# flow per case, listed below), and the server ports learned by the hosts.
#
# The manager 192.168.8.1 polls the agents 192.168.8.x (port 161) and receives
# their traps and informs (port 162). Expected client: the manager for the
# polls (Get, GetNext, GetBulk, Set and their Responses/Reports), the agent for
# the traps and informs (the receiver, port 162, is the server). The server
# ports are learned from the bidirectional flows: 161 by the polled agents, 162
# by the manager, never the ephemeral ports of the manager.
# The direction of SNMPv1/v2c flows is decided by the PDU type of the first
# packet: the flows marked "reply first" below start with a reply (Response,
# Report) and are swapped. SNMPv3 flows are not decided (their PDU is usually
# encrypted): the sender of the first packet is the client.
#
#   192.168.8.10   GetRequest, then Response (v2c)
#   192.168.8.11   Response only (v2c)                          (reply first)
#   192.168.8.12   Response, then the next GetNextRequest (v1)  (reply first)
#   192.168.8.13   GetBulk, Response, Set, Response (v2c)
#   192.168.8.14   Trap v1 sent to 162
#   192.168.8.15   SNMPv2-Trap sent to 162, from port 161
#   192.168.8.16   Inform sent to 162, then its Response
#   192.168.8.17   Response of an Inform only (from 162)        (reply first)
#   192.168.8.18   Report only (v2c framing)                    (reply first)
#   192.168.8.19   SNMPv3 GetRequest, then Response
#   192.168.8.20   SNMPv3 Response only (stays reversed: SNMPv3 is not decided)
#   192.168.8.21   Response only, community of 200 bytes        (reply first)

pre: |
  # Disable everything not related to this test
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null

runtime: |
  # Client and server of the active flows
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/flow/active.lua?ifid=0&perPage=100" | jq -c '[.rsp.data[] | {cli_ip: .client.ip, cli_port: .client.port, srv_ip: .server.ip, srv_port: .server.port, l7: .protocol.l7}] | sort_by(.cli_ip, .srv_ip, .cli_port) | .[]'

  # Server ports learned by the hosts
  for h in 192.168.8.1 192.168.8.10 192.168.8.11 192.168.8.12 192.168.8.13 192.168.8.14 192.168.8.15 192.168.8.16 192.168.8.17 192.168.8.18 192.168.8.19 192.168.8.20 192.168.8.21; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/open_ports.lua?ifid=0&host=${h}" | jq -c --arg host "${h}" '{host: $host, server_ports: ([.rsp[]?.key | tonumber] | sort)}'
  done
