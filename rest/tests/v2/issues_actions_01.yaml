# Issues (Enterprise XXL+): user actions (acknowledge, assign, comment, suppress, resolve, reopen) and timeline
input: tcp-flood.pcap

localnet: 192.168.1.0/24

requires: pro

ignore:
  - auto_resolve_at
  - issue_id
  - first_seen
  - last_seen
  - resolved_at
  - duration
  - tstamp
  - suppressed_until
  - until
  - ack_tstamp
  - alerts_url

pre: |
  # Issues are off by default (Preferences > Alerts > Issues)
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"pref_section": "alerts", "pref_key": "toggle_issues", "pref_value": "1"}' http://localhost:3333/lua/rest/v2/set/ntopng/preferences.lua > /dev/null
  # The alerts of the pcap are Notice: below the default Issues Minimum Severity (Warning)
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"pref_section": "alerts", "pref_key": "issues_min_severity", "pref_value": "3"}' http://localhost:3333/lua/rest/v2/set/ntopng/preferences.lua > /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "tcp_no_data_exchanged"}' http://localhost:3333/lua/rest/v2/enable/check.lua

post: |
  B=http://localhost:3333/lua/pro/rest/v2
  ID=$(curl -s -u admin:admin "${B}/get/issue/list.lua?view=problems&entity_id=4&sort=signal_count&order=desc&length=1" | jq '.rsp[0].issue_id')
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}}" ${B}/edit/issue/acknowledge.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}, \"assignee\": \"admin\"}" ${B}/edit/issue/assign.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}, \"assignee\": \"nobody\"}" ${B}/edit/issue/assign.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}, \"comment\": \"Checking the server\"}" ${B}/edit/issue/comment.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}, \"duration\": 3600}" ${B}/edit/issue/suppress.lua
  curl -s -u admin:admin "${B}/get/issue/list.lua?view=problems&entity_id=4&show_suppressed=true&length=10" | jq -c '{rc: .rc, suppressed: [.rsp[] | select(.suppressed) | .entity.name]}'
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}}" ${B}/edit/issue/resolve.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}}" ${B}/edit/issue/resolve.lua
  curl -s -u admin:admin "${B}/get/issue/list.lua?view=recent&entity_id=4&length=10"
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": ${ID}}" ${B}/edit/issue/reopen.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d "{\"issue_id\": 999999}" ${B}/edit/issue/acknowledge.lua
  curl -s -u admin:admin "${B}/get/issue/details.lua?issue_id=${ID}"
  curl -s -u admin:admin "${B}/get/issue/events.lua?issue_id=${ID}"
  # Resolve All: the reopened issue is suppressed (hidden by default), invalid view, then with the suppressed ones
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"view": "problems", "entity_id": "4"}' ${B}/edit/issue/resolve_all.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"view": "history", "entity_id": "4"}' ${B}/edit/issue/resolve_all.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"view": "problems", "entity_id": "4", "suppressed": "0,1"}' ${B}/edit/issue/resolve_all.lua
  curl -s -u admin:admin "${B}/get/issue/list.lua?view=problems&entity_id=4&suppressed=0,1&length=10" | jq -c '{rc: .rc, open: .recordsTotal}'
