input: dhcp_v6_cases.pcap

localnet: fd00:6::/64

# Unexpected DHCP server alert (check unexpected_dhcp) on the DHCPv6 flows of
# dhcp_v6_cases.pcap (see flow_direction_dhcpv6_01), with fd00:6::1 as the
# only configured DHCP server (no VLAN: allowed on every VLAN).
#
# A host is an unexpected DHCP server only when it replies (a request with no
# reply raises no alert).
#
# Expected: one alert per flow where the rogue fd00:6::2 replies, whatever the
# order of the packets and also behind a relay: ADVERTISE only (fe80::20),
# RENEW then REPLY (fe80::21), REPLY then RENEW (fe80::22), relayed by
# fd00:6::fd and fd00:6::fe; and one for the relay agent fd00:6::fc (not
# configured) delivering a reply to a client. The DHCPv6 server is named in
# the description and blamed (attacker, most of the score). No alert for the
# requests with no reply (RENEW only fe80::24, SOLICIT from port 45474
# fe80::23) and for the flows of fd00:6::1, relayed or not, on any VLAN.

ignore:
  - duration
  - title
  - epoch_end
  - num_records_processed
  - query_duration_msec

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"dhcp_list": "fd00:6::1"}' http://localhost:3333/lua/rest/v2/set/network/config.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua -o /dev/null
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "check_subdir": "flow", "script_key": "unexpected_dhcp"}' http://localhost:3333/lua/rest/v2/enable/check.lua -o /dev/null

runtime: |
  # Score of the hosts, as client and as server (who is blamed)
  for h in fd00:6::1 fd00:6::2 fe80::20 fe80::21 fe80::22 fe80::23 fe80::24 \
           fe80::32 fd00:6::fd fd00:6::fe fd00:6::fc; do
    curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/data.lua?ifid=0&host=${h}" | jq -c --arg host "${h}" 'if .rc == 0 then {host: $host, score_as_client: .rsp["score.as_client"], score_as_server: .rsp["score.as_server"]} else {host: $host, rc: .rc} end'
  done

post: |
  # The alerts: flow, description, roles and score
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "status": "any", "length": 100}' http://localhost:3333/lua/rest/v2/get/flow/alert/list.lua | jq -c '[.rsp.records[] | {cli_ip: .cli_ip.value, cli_port: .cli_port.value, srv_ip: .srv_ip.value, srv_port: .srv_port.value, vlan: .vlan_id.value, alert: .alert_name, description: .description.descr, cli_role: .cli_role.value, srv_role: .srv_role.value, score: .score.value}] | sort_by(.cli_ip, .srv_ip, .vlan) | .[]'
