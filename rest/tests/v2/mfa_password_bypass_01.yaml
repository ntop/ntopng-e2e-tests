# Second factor (TOTP) vs. password sent with each request (ANT-2026-U2NTW31Z).
#
# The second factor is asked only by the login form (/authorize.html). The
# password can also be sent with each request, as an 'Authorization: Basic'
# header or as 'user'/'password' cookies: for a user with TOTP enabled these
# must be refused (302 to the login page), or the password alone gives the
# whole account, including a new session, an API token and, for an
# administrator, switching MFA off (no CSRF token is needed: no session).
#
# Login is enabled for this test ('login: true'): the harness seeds 'admin'
# with the password in $NTOPNG_TEST_ADMIN_PASSWORD.
#
# - admin adds 'alice' (who will enable TOTP) and 'bob' (who won't)
# - alice, before enabling TOTP, gets an API token (it must keep working)
# - alice enables TOTP, as the GUI MFA tab does (generate_secret, enable)
# - alice's API token: still accepted
# - control: the login form with the password alone gives the MFA page
# - alice's password in the Basic header / cookies: REST read, page, new
#   session, new API token: all refused
# - bob (no second factor): Basic header / cookies still accepted, a wrong
#   password is refused
# - admin enables TOTP too; its password in the Basic header can't read the
#   user list nor disable MFA, and the login form still asks for the code
#
# Only status codes, pages and flags are printed: no code, token or secret.
# Passkeys (isWebAuthnEnabled) take the same code path but are not covered:
# registering one needs an authenticator.

login: true

post: |
  B=http://localhost:3333
  APW="${NTOPNG_TEST_ADMIN_PASSWORD}"
  PW=Alice_pw_1234
  BPW=Bob_pw_1234

  # $1 = secret: prints the current TOTP code (RFC 6238, SHA1, 30 s, 6 digits)
  totp() {
    python3 -I -c '
  import sys, hmac, hashlib, struct, time, base64
  s = sys.argv[1]; k = base64.b32decode(s + "=" * (-len(s) % 8))
  h = hmac.new(k, struct.pack(">Q", int(time.time() // 30)), hashlib.sha1).digest(); o = h[-1] & 15
  print("%06d" % ((struct.unpack(">I", h[o:o + 4])[0] & 0x7fffffff) % 1000000))
  ' "$@"
  }

  # $1 = step label, then curl arguments: prints the HTTP code, the redirect
  # page (no query string), the REST rc and whether a JSON body came back
  req() {
    local step="$1" out code loc body rc; shift
    out=$(curl -s -o /dev/stdout -w '\n%{http_code} %{redirect_url}' "$@")
    body=$(echo "${out}" | sed '$d')
    code=$(echo "${out}" | tail -n1 | cut -d' ' -f1)
    loc=$(echo "${out}" | tail -n1 | cut -s -d' ' -f2)
    loc=$(echo "${loc%%\?*}" | sed 's#^[a-z]*://[^/]*##')
    rc=$(echo "${body}" | jq -r '.rc // .result // "none"' 2>/dev/null || echo none)
    jq -nc --arg step "${step}" --arg code "${code}" --arg page "${loc:-none}" --arg rc "${rc:-none}" \
      '{step: $step, http: $code, redirect: $page, rc: $rc}'
  }

  # Login form, password only: $1 = step label, $2 = user, $3 = password
  login() {
    local hdr loc session
    hdr=$(curl -s -o /dev/null -D - --data-urlencode "user=$2" --data-urlencode "password=$3" "${B}/authorize.html" | tr -d '\r')
    loc=$(echo "${hdr}" | sed -n 's/^Location: //Ip'); loc=$(echo "${loc%%\?*}" | sed 's#^[a-z]*://[^/]*##')
    if echo "${hdr}" | grep -qi '^Set-Cookie: session_'; then session=true; else session=false; fi
    jq -nc --arg step "$1" --arg page "${loc}" --argjson session ${session} '{step: $step, page: $page, session: $session}'
  }

  # $1 = user, $2 = password: prints the TOTP secret, after enabling TOTP
  enable_totp() {
    local secret
    secret=$(curl -s -u "$1:$2" -d action=generate_secret -d "username=$1" "${B}/lua/admin/change_user_mfa.lua" | jq -r '.secret // empty')
    curl -s -u "$1:$2" -d action=enable -d "username=$1" -d "totp=$(totp "${secret}")" "${B}/lua/admin/change_user_mfa.lua" \
      | jq -c --arg u "$1" '{step: ("enable_totp_" + $u), result: .result, message: .message}' >&2
    echo "${secret}"
  }

  # Setup
  for u in alice:${PW} bob:${BPW}; do
    curl -s -u "admin:${APW}" -d "username=${u%%:*}" -d "full_name=${u%%:*}" -d "password=${u#*:}" -d "confirm_password=${u#*:}" \
      -d user_role=unprivileged -d allowed_networks=0.0.0.0/0,::/0 -d allowed_interface= -d add_user_language=en \
      "${B}/lua/rest/v2/add/ntopng/user.lua" | jq -c --arg u "${u%%:*}" '{step: ("add_user_" + $u), rc: .rc}'
  done
  TOKEN=$(curl -s -u "alice:${PW}" -d username=alice "${B}/lua/rest/v2/create/ntopng/api_token.lua" | jq -r '.rsp.api_token // empty')
  jq -nc --argjson ok $([ -n "${TOKEN}" ] && echo true || echo false) '{step: "alice_token_before_totp", ok: $ok}'
  enable_totp alice "${PW}" 2>&1 >/dev/null

  # Control: the login form asks for the second factor
  login "alice_form" alice "${PW}"

  # alice's API token: accepted
  REST="${B}/lua/rest/v2/get/ntopng/interfaces.lua"
  req "alice_token_rest" -H "Authorization: Token ${TOKEN}" "${REST}"

  # alice's password sent with the request: refused (the last request would
  # replace the API token above)
  req "alice_basic_rest" -u "alice:${PW}" "${REST}"
  req "alice_cookie_rest" -b "user=alice; password=${PW}" "${REST}"
  req "alice_basic_page" -u "alice:${PW}" "${B}/lua/if_stats.lua"
  req "alice_cookie_page" -b "user=alice; password=${PW}" "${B}/lua/if_stats.lua"
  req "alice_basic_new_session" -u "alice:${PW}" -d username=alice "${B}/lua/rest/v2/create/ntopng/session.lua"
  req "alice_cookie_new_session" -b "user=alice; password=${PW}" -d username=alice "${B}/lua/rest/v2/create/ntopng/session.lua"
  req "alice_basic_new_token" -u "alice:${PW}" -d username=alice "${B}/lua/rest/v2/create/ntopng/api_token.lua"

  # bob has no second factor: the password is enough, a wrong one is not
  req "bob_basic_rest" -u "bob:${BPW}" "${REST}"
  req "bob_cookie_rest" -b "user=bob; password=${BPW}" "${REST}"
  req "bob_basic_wrong_password" -u "bob:wrong" "${REST}"

  # admin with TOTP: the password can't read the user list nor disable MFA
  enable_totp admin "${APW}" 2>&1 >/dev/null
  login "admin_form" admin "${APW}"
  req "admin_basic_users" -u "admin:${APW}" "${B}/lua/rest/v2/get/ntopng/users.lua"
  req "admin_cookie_users" -b "user=admin; password=${APW}" "${B}/lua/rest/v2/get/ntopng/users.lua"
  req "admin_basic_disable_mfa" -u "admin:${APW}" -d action=disable -d username=admin "${B}/lua/admin/change_user_mfa.lua"
  login "admin_form_after_disable" admin "${APW}"
