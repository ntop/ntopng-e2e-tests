input: test_01.pcap

localnet: 192.168.1.0/24

pre: |
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"ifid": 0, "action": "disable"}' http://localhost:3333/lua/toggle_all_checks.lua
  curl -s -u admin:admin -H "Content-Type: application/json" -d '{"host" : "192.168.1.93", "custom_name": "Charles"}' http://localhost:3333/lua/rest/v2/set/host/alias.lua

runtime: |
  # The alias is the label of the host (host details page), and the alias of its configuration
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/overview.lua?ifid=0&host=192.168.1.93" | jq -c '{rc: .rc_str, label: .rsp.host.label}'
  curl -s -u admin:admin "http://localhost:3333/lua/rest/v2/get/host/config.lua?ifid=0&host=192.168.1.93" | jq -c '{rc: .rc_str, alias: .rsp.alias}'
